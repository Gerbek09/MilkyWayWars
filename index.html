<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wars of the Milky Way</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        canvas { background-color: #03030f; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); border: 2px solid #333; max-height: 100vh; max-width: 100vw; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 480, HEIGHT = 800;
        canvas.width = WIDTH; canvas.height = HEIGHT;

        // Цвета
        const CYAN = '#00ffff', MAGENTA = '#ff00ff', WHITE = '#ffffff', RED = '#ff3232', GREEN = '#32ff64', YELLOW = '#ffdc32', BLUE = '#6496ff', PURPLE = '#b450ff';

        // ========== ЗАГРУЗКА СПРАЙТОВ ==========
        const sprites = {
            player: new Image(), dreadnought: new Image(), bug: new Image(), interceptor: new Image(), boss: new Image()
        };
        sprites.player.src = 'assets/images/player_ship.png';
        sprites.dreadnought.src = 'assets/images/enemy_dreadnought.png';
        sprites.bug.src = 'assets/images/enemy_bug.png';
        sprites.interceptor.src = 'assets/images/enemy_interceptor.png';
        sprites.boss.src = 'assets/images/enemy_boss.png';

        // ========== СИСТЕМА ЗВУКА (Web Audio API) ==========
        let audioCtx = null;
        let soundEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                soundEnabled = true;
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        // ========== ПЕРЕМЕННЫЕ ==========
        let gameState = "splash"; 
        let currentLang = 'ru';
        let splashStartTime = Date.now();
        
        let player = { x: WIDTH / 2, y: HEIGHT - 100, speed: 6, lives: 3, score: 0, invincible: 0, shield: 0, weaponPower: 1, weaponTimer: 0 };
        let bullets = [], bossBullets = [], enemies = [], powerups = [], particles = [];
        let wave = 1, enemiesInWave = 0;
        const ENEMIES_PER_WAVE = 10, WAVE_DELAY = 300;
        let waveTimer = 0, waveState = "transition", boss = null, bossDefeatedTimer = 0;
        let shootTimer = 0, spawnTimer = 0;
        const BULLET_COOLDOWN = 15, BULLET_SPEED = 10, ENEMY_SPAWN_RATE = 60;

        let stars = [];
        for(let i=0; i<250; i++) {
            stars.push({ x: Math.random()*WIDTH, y: Math.random()*HEIGHT, size: Math.random()*2+1, speed: Math.random()*2+1.5, phase: Math.random()*Math.PI*2, isBright: Math.random()<0.08 });
        }

        let keys = {}, touchActive = false, touchX = WIDTH/2, touchY = HEIGHT-100, hoveredButton = null;

        // ========== ЛОКАЛИЗАЦИЯ ==========
        const lang = {
            ru: { title1:'ВОЙНЫ', title2:'МЛЕЧНОГО ПУТИ', subtitle:'КОСМИЧЕСКИЙ ШУТЕР', press:'НАЖМИ ЛЮБУЮ КЛАВИШУ', play:'ИГРАТЬ', info:'ИНФОРМАЦИЯ', records:'РЕКОРДЫ', settings:'НАСТРОЙКИ', exit:'ВЫХОД', back:'НАЗАД', wave:'ВОЛНА', boss:'БОСС!', prepare:'Приготовься!', boss_defeated:'БОСС ПОБЕЖДЁН!', game_over:'GAME OVER', score:'Счёт', restart:'ЗАНОВО', menu:'В МЕНЮ', enemies:'ВРАГИ', weapons:'ОРУЖИЕ', powerups:'БОНУСЫ', language:'Язык', russian:'Русский', english:'English', no_records:'Пока нет рекордов', in_dev:'Раздел в разработке...' },
            en: { title1:'WARS', title2:'OF THE MILKY WAY', subtitle:'A SPACE SHOOTER', press:'PRESS ANY KEY', play:'PLAY', info:'INFO', records:'RECORDS', settings:'SETTINGS', exit:'EXIT', back:'BACK', wave:'WAVE', boss:'BOSS!', prepare:'Get Ready!', boss_defeated:'BOSS DEFEATED!', game_over:'GAME OVER', score:'Score', restart:'RESTART', menu:'TO MENU', enemies:'ENEMIES', weapons:'WEAPONS', powerups:'POWER-UPS', language:'Language', russian:'Русский', english:'English', no_records:'No records yet', in_dev:'In development...' }
        };
        function t(key) { return lang[currentLang][key] || key; }

        // ========== СОБЫТИЯ ==========
        window.addEventListener('keydown', e => { 
            initAudio(); // Включаем звук при первом нажатии
            keys[e.code] = true; 
            if(gameState==="splash" && (Date.now()-splashStartTime)/1000>=3) gameState="menu"; 
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * (WIDTH / rect.width), y: (cy - rect.top) * (HEIGHT / rect.height) };
        }

        canvas.addEventListener('mousemove', e => {
            const pos = getMousePos(e);
            if (gameState === "menu") checkMenuHover(pos.x, pos.y);
            if (touchActive && gameState === "playing") { touchX = pos.x; touchY = pos.y; }
        });
        
        canvas.addEventListener('mousedown', e => {
            initAudio(); // Включаем звук при первом клике
            const pos = getMousePos(e);
            if (gameState === "splash") gameState = "menu";
            else if (gameState === "playing") { touchActive = true; touchX = pos.x; touchY = pos.y; }
            handleMenuClick(pos.x, pos.y);
        });
        window.addEventListener('mouseup', () => touchActive = false);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); initAudio(); // Включаем звук на мобильном
            const pos = getMousePos(e);
            if (gameState === "splash") gameState = "menu";
            else if (gameState === "playing") { touchActive = true; touchX = pos.x; touchY = pos.y; }
            handleMenuClick(pos.x, pos.y);
        }, {passive: false});
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (gameState === "playing") { const pos = getMousePos(e); touchX = pos.x; touchY = pos.y; }
        }, {passive: false});

        function handleMenuClick(mx, my) {
            if (gameState === "menu") {
                if (hoveredButton === t('play')) { gameState = "playing"; resetGame(); }
                else if (hoveredButton === t('info')) gameState = "info";
                else if (hoveredButton === t('records')) gameState = "records";
                else if (hoveredButton === t('settings')) gameState = "settings";
                else if (hoveredButton === t('exit')) alert("Закройте вкладку для выхода.");
            }
            if (["info","records","settings"].includes(gameState)) {
                if (mx >= WIDTH/2-150 && mx <= WIDTH/2+150 && my >= HEIGHT-70 && my <= HEIGHT-15) gameState = "menu";
                if (gameState === "settings") {
                    if (mx >= WIDTH/2-210 && mx <= WIDTH/2-10 && my >= 280 && my <= 340) currentLang = 'ru';
                    if (mx >= WIDTH/2+10 && mx <= WIDTH/2+210 && my >= 280 && my <= 340) currentLang = 'en';
                }
            }
            if (gameState === "game_over") {
                if (mx >= WIDTH/2-100 && mx <= WIDTH/2+100 && my >= HEIGHT/2+150 && my <= HEIGHT/2+195) { gameState = "playing"; resetGame(); }
                if (mx >= WIDTH/2-100 && mx <= WIDTH/2+100 && my >= HEIGHT/2+205 && my <= HEIGHT/2+250) gameState = "menu";
            }
        }
        
        function checkMenuHover(mx, my) {
            hoveredButton = null;
            const btnTexts = [t('play'), t('info'), t('records'), t('settings'), t('exit')];
            const btnYs = [380, 460, 540, 620, 700];
            for(let i=0; i<btnTexts.length; i++) {
                if (mx >= WIDTH/2-150 && mx <= WIDTH/2+150 && my >= btnYs[i] && my <= btnYs[i]+55) hoveredButton = btnTexts[i];
            }
        }

        // ========== ЛОГИКА ==========
        function resetGame() {
            player = { x: WIDTH/2, y: HEIGHT-100, speed: 6, lives: 3, score: 0, invincible: 0, shield: 0, weaponPower: 1, weaponTimer: 0 };
            bullets = []; bossBullets = []; enemies = []; powerups = []; particles = [];
            wave = 1; waveState = "transition"; waveTimer = WAVE_DELAY; enemiesInWave = 0;
            boss = null; bossDefeatedTimer = 0; shootTimer = 0; spawnTimer = 0;
        }

        function update() {
            if (gameState !== "playing") return;

            if (touchActive) {
                let dx = touchX - player.x, dy = touchY - player.y, dist = Math.hypot(dx, dy);
                if (dist > 5) { player.x += (dx/dist)*player.speed; player.y += (dy/dist)*player.speed; }
            } else {
                if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
                if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
                if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
                if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            }
            player.x = Math.max(25, Math.min(WIDTH-25, player.x));
            player.y = Math.max(50, Math.min(HEIGHT-50, player.y));
            if (player.invincible > 0) player.invincible--;
            if (player.weaponTimer > 0 && --player.weaponTimer <= 0) player.weaponPower = 1;

            if (waveState === "transition") {
                if (--waveTimer <= 0) {
                    if (wave % 3 === 0) { boss = { x: WIDTH/2, y: -100, targetY: 150, hp: 20+wave*5, maxHp: 20+wave*5, size: 60, speed: 2, dir: 1, timer: 0, entering: true }; waveState = "boss_fight"; }
                    else { waveState = "playing"; enemiesInWave = 0; }
                }
            } else if (waveState === "boss_defeated") {
                if (--bossDefeatedTimer <= 0) { waveState = "transition"; waveTimer = WAVE_DELAY; }
            } else if (waveState === "playing") {
                spawnTimer++;
                let spawnRate = Math.max(20, ENEMY_SPAWN_RATE - wave * 3);
                if (spawnTimer >= spawnRate && enemiesInWave < ENEMIES_PER_WAVE) { spawnEnemy(); spawnTimer = 0; }
                if (enemiesInWave >= ENEMIES_PER_WAVE && enemies.length === 0) { waveState = "transition"; waveTimer = WAVE_DELAY; wave++; enemiesInWave = 0; }
            } else if (waveState === "boss_fight") {
                if (boss) {
                    if (boss.entering) { if ((boss.y += 2) >= boss.targetY) boss.entering = false; }
                    else {
                        boss.x += boss.dir * boss.speed;
                        if (boss.x > WIDTH-80) boss.dir = -1; else if (boss.x < 80) boss.dir = 1;
                        if (++boss.timer >= 40) {
                            boss.timer = 0;
                            let dx = player.x - boss.x, dy = player.y - boss.y, dist = Math.hypot(dx, dy);
                            if (dist > 0) bossBullets.push({ x: boss.x, y: boss.y+boss.size, vx: (dx/dist)*5, vy: (dy/dist)*5 });
                        }
                    }
                }
            }

            if (++shootTimer >= BULLET_COOLDOWN) {
                bullets.push({ x: player.x, y: player.y - 30 });
                if (player.weaponPower > 1) { bullets.push({ x: player.x - 15, y: player.y - 25 }); bullets.push({ x: player.x + 15, y: player.y - 25 }); }
                shootTimer = 0;
                playSound('shoot');
            }

            bullets.forEach(b => b.y -= BULLET_SPEED); bullets = bullets.filter(b => b.y > -20);
            enemies.forEach(e => e.y += e.speed); enemies = enemies.filter(e => e.y < HEIGHT + 50);
            powerups.forEach(p => p.y += p.speed); powerups = powerups.filter(p => p.y < HEIGHT + 30);
            bossBullets.forEach(b => { b.x += b.vx; b.y += b.vy; }); bossBullets = bossBullets.filter(b => b.y > -20 && b.y < HEIGHT+20 && b.x > -20 && b.x < WIDTH+20);
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; p.vx *= 0.95; p.vy *= 0.95; }); particles = particles.filter(p => p.life > 0);

            checkCollisions();
        }

        function spawnEnemy() {
            const types = [
                { name:'dreadnought', speed:1.5, size:30, hp:3, score:30, color:RED },
                { name:'bug', speed:3.0, size:25, hp:1, score:10, color:'#ff8c00' },
                { name:'interceptor', speed:2.5, size:28, hp:2, score:20, color:GREEN }
            ];
            const type = types[Math.floor(Math.random()*types.length)];
            const speedMult = 1 + (wave-1)*0.1;
            enemies.push({ x: Math.random()*(WIDTH-80)+40, y:-30, speed:type.speed*speedMult, size:type.size, color:type.color, hp:type.hp, maxHp:type.hp, name:type.name, score:type.score });
        }

        function checkCollisions() {
            for (let i = bullets.length-1; i >= 0; i--) {
                let b = bullets[i];
                for (let j = enemies.length-1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(b.x-e.x, b.y-e.y) < e.size) {
                        if (--e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, 20); player.score += e.score;
                            playSound('explosion');
                            if (Math.random() < 0.2) { let ptype = ['shield','weapon','bomb','life'][Math.floor(Math.random()*4)]; powerups.push({x:e.x,y:e.y,type:ptype,color:ptype==='shield'?GREEN:ptype==='weapon'?YELLOW:ptype==='bomb'?BLUE:RED,speed:2}); }
                            enemies.splice(j, 1); enemiesInWave++;
                        } bullets.splice(i, 1); break;
                    }
                }
            }
            if (boss) {
                for (let i = bullets.length-1; i >= 0; i--) {
                    if (Math.hypot(bullets[i].x-boss.x, bullets[i].y-boss.y) < boss.size) {
                        if (--boss.hp <= 0) {
                            createBigExplosion(boss.x, boss.y); player.score += 500*wave; bossBullets = []; boss = null;
                            playSound('explosion');
                            waveState = "boss_defeated"; bossDefeatedTimer = 180; wave++; enemiesInWave = 0;
                        } bullets.splice(i, 1); break;
                    }
                }
            }
            if (player.invincible <= 0) {
                for (let i = enemies.length-1; i >= 0; i--) {
                    if (Math.hypot(player.x-enemies[i].x, player.y-enemies[i].y) < enemies[i].size+20) {
                        if (player.shield > 0) { player.shield = 0; createExplosion(enemies[i].x, enemies[i].y, GREEN, 20); }
                        else { player.lives--; player.invincible = 90; player.weaponPower = 1; player.weaponTimer = 0; createExplosion(enemies[i].x, enemies[i].y, enemies[i].color, 25); playSound('explosion'); if (player.lives <= 0) { gameState = "game_over"; playSound('gameover'); } }
                        enemies.splice(i, 1); break;
                    }
                }
                for (let i = bossBullets.length-1; i >= 0; i--) {
                    if (Math.hypot(player.x-bossBullets[i].x, player.y-bossBullets[i].y) < 25) {
                        if (player.shield > 0) { player.shield = 0; createExplosion(bossBullets[i].x, bossBullets[i].y, GREEN, 15); }
                        else { player.lives--; player.invincible = 90; player.weaponPower = 1; player.weaponTimer = 0; createExplosion(player.x, player.y, RED, 25); playSound('explosion'); if (player.lives <= 0) { gameState = "game_over"; playSound('gameover'); } }
                        bossBullets.splice(i, 1); break;
                    }
                }
            }
            for (let i = powerups.length-1; i >= 0; i--) {
                if (Math.hypot(player.x-powerups[i].x, player.y-powerups[i].y) < 35) {
                    let p = powerups[i];
                    if (p.type === 'shield') player.shield = 1;
                    else if (p.type === 'weapon') { player.weaponPower = 3; player.weaponTimer = 1800; }
                    else if (p.type === 'bomb') { enemies.forEach(e => { player.score += e.score; createExplosion(e.x, e.y, e.color, 15); }); enemies = []; createBigExplosion(WIDTH/2, HEIGHT/2); }
                    else if (p.type === 'life' && player.lives < 5) player.lives++;
                    createExplosion(p.x, p.y, p.color, 15); playSound('powerup'); powerups.splice(i, 1);
                }
            }
        }

        function createExplosion(x, y, color, count) { for(let i=0; i<count; i++) { let a = Math.random()*Math.PI*2, s = Math.random()*4+2; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.0,color,size:Math.random()*3+2}); } }
        function createBigExplosion(x, y) { for(let i=0; i<50; i++) { let a = Math.random()*Math.PI*2, s = Math.random()*7+3; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.0,color:[YELLOW,RED,WHITE,BLUE,PURPLE][Math.floor(Math.random()*5)],size:Math.random()*4+3}); } }

        // ========== ОТРИСОВКА ==========
        function draw() {
            ctx.fillStyle = '#03030f'; ctx.fillRect(0,0,WIDTH,HEIGHT);
            let time = Date.now()/1000;
            stars.forEach(s => {
                let tw = (Math.sin(time*s.speed+s.phase)+1)/2;
                ctx.fillStyle = s.isBright && tw>0.3 ? `rgb(255,255,255)` : `rgb(${Math.floor(40+180*tw)},${Math.floor(40+180*tw)},${Math.floor(40+180*tw)})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            });

            if (gameState === "splash") drawSplash(time);
            else if (gameState === "menu") drawMenu();
            else if (gameState === "playing") drawGame();
            else if (gameState === "game_over") { drawGame(); drawGameOver(); }
            else if (gameState === "info") drawInfo();
            else if (gameState === "records") drawRecords();
            else if (gameState === "settings") drawSettings();
        }

        function drawSplash(time) {
            let elapsed = (Date.now()-splashStartTime)/1000; ctx.textAlign='center';
            if (elapsed > 0.5) {
                ctx.font = 'bold 72px Impact, sans-serif'; ctx.fillStyle = MAGENTA; ctx.shadowColor = CYAN; ctx.shadowBlur = 20;
                ctx.fillText(t('title1'), WIDTH/2, HEIGHT/3-30);
                ctx.font = 'bold 48px Impact, sans-serif'; ctx.fillStyle = CYAN; ctx.shadowColor = MAGENTA;
                ctx.fillText(t('title2'), WIDTH/2, HEIGHT/3+40); ctx.shadowBlur = 0;
            }
            if (elapsed >= 2.5) { ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(t('subtitle'), WIDTH/2, HEIGHT/2+80); }
            if (elapsed >= 3.0 && Math.floor(time*2)%2===0) { ctx.font='26px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(t('press'), WIDTH/2, HEIGHT-120); }
        }

        function drawMenu() {
            ctx.textAlign='center';
            ctx.font = 'bold 72px Impact'; ctx.fillStyle = MAGENTA; ctx.shadowColor = CYAN; ctx.shadowBlur = 20;
            ctx.fillText(t('title1'), WIDTH/2, 100);
            ctx.font = 'bold 48px Impact'; ctx.fillStyle = CYAN; ctx.shadowColor = MAGENTA;
            ctx.fillText(t('title2'), WIDTH/2, 170); ctx.shadowBlur = 0;

            const texts = [t('play'),t('info'),t('records'),t('settings'),t('exit')];
            const colors = [GREEN,CYAN,YELLOW,PURPLE,RED];
            const ys = [380,460,540,620,700];
            for (let i=0; i<texts.length; i++) {
                let h = (hoveredButton === texts[i]);
                ctx.fillStyle = h ? 'rgba(255,255,255,0.1)' : 'rgba(10,10,30,0.7)';
                ctx.strokeStyle = colors[i]; ctx.lineWidth = h ? 4 : 2;
                ctx.shadowColor = colors[i]; ctx.shadowBlur = h ? 15 : 0;
                ctx.beginPath(); ctx.roundRect(WIDTH/2-150, ys[i], 300, 55, 15); ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0; ctx.fillStyle = colors[i]; ctx.font='32px Segoe UI';
                ctx.fillText(texts[i], WIDTH/2, ys[i]+38);
            }
        }

        function drawGame() {
            if (player.invincible <= 0 || Math.floor(player.invincible/5)%2===0) {
                if (sprites.player.complete && sprites.player.naturalWidth > 0) {
                    ctx.drawImage(sprites.player, player.x - 40, player.y - 50, 80, 100);
                } else {
                    ctx.fillStyle = CYAN; ctx.beginPath(); ctx.moveTo(player.x, player.y-30); ctx.lineTo(player.x+20, player.y+20); ctx.lineTo(player.x-20, player.y+20); ctx.fill();
                }
                if (player.shield > 0) { ctx.strokeStyle = GREEN; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(player.x, player.y, 45, 0, Math.PI*2); ctx.stroke(); }
            }

            bullets.forEach(b => { ctx.fillStyle = CYAN; ctx.fillRect(b.x-2, b.y, 4, 15); });
            bossBullets.forEach(b => { ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill(); });

            enemies.forEach(e => {
                let spr = sprites[e.name];
                if (spr && spr.complete && spr.naturalWidth > 0) {
                    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI); ctx.drawImage(spr, -e.size, -e.size, e.size*2, e.size*2); ctx.restore();
                } else {
                    ctx.fillStyle = e.color; ctx.beginPath(); ctx.moveTo(e.x, e.y+e.size); ctx.lineTo(e.x+e.size, e.y-e.size); ctx.lineTo(e.x-e.size, e.y-e.size); ctx.closePath(); ctx.fill();
                }
                if (e.hp > 1) { ctx.fillStyle = '#555'; ctx.fillRect(e.x-e.size, e.y-e.size-10, e.size*2, 4); ctx.fillStyle = GREEN; ctx.fillRect(e.x-e.size, e.y-e.size-10, e.size*2*(e.hp/e.maxHp), 4); }
            });

            if (boss) {
                if (sprites.boss.complete && sprites.boss.naturalWidth > 0) {
                    ctx.drawImage(sprites.boss, boss.x - boss.size, boss.y - boss.size, boss.size*2, boss.size*2);
                } else {
                    ctx.fillStyle = PURPLE; ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle='#555'; ctx.fillRect(20,60,WIDTH-40,12); ctx.fillStyle=PURPLE; ctx.fillRect(20,60,(WIDTH-40)*(boss.hp/boss.maxHp),12);
            }

            powerups.forEach(p => {
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = WHITE; ctx.font='bold 20px Arial'; ctx.textAlign='center';
                ctx.fillText(p.type==='shield'?'S':p.type==='weapon'?'W':p.type==='bomb'?'B':'+', p.x, p.y+7);
            });

            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1.0;

            ctx.textAlign='left'; ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(`${t('score')}: ${player.score}`, WIDTH-180, 30);
            ctx.textAlign='center'; ctx.fillStyle=YELLOW; ctx.fillText(`${t('wave')}: ${wave}`, WIDTH/2, 30);
            for(let i=0; i<player.lives; i++) { ctx.fillStyle=RED; ctx.fillRect(20+i*30-8,20,16,4); ctx.fillRect(20+i*30-2,14,4,16); }

            if (waveState === "transition") {
                ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,WIDTH,HEIGHT); ctx.textAlign='center';
                ctx.font='bold 56px Impact'; ctx.fillStyle = (wave%3===0)?RED:CYAN; ctx.fillText((wave%3===0)?t('boss'):`${t('wave')} ${wave}`, WIDTH/2, HEIGHT/2-20);
                ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText((wave%3===0)?`${t('wave')} ${wave}`:t('prepare'), WIDTH/2, HEIGHT/2+40);
            } else if (waveState === "boss_defeated") {
                ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,WIDTH,HEIGHT); ctx.textAlign='center';
                ctx.font='bold 48px Impact'; ctx.fillStyle=YELLOW; ctx.fillText(t('boss_defeated'), WIDTH/2, HEIGHT/2-20);
            }
        }

        function drawGameOver() {
            ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,WIDTH,HEIGHT); ctx.textAlign='center';
            ctx.font='bold 48px Impact'; ctx.fillStyle=RED; ctx.fillText(t('game_over'), WIDTH/2, HEIGHT/2-120);
            ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(`${t('score')}: ${player.score}`, WIDTH/2, HEIGHT/2-60); ctx.fillStyle=YELLOW; ctx.fillText(`${t('wave')}: ${wave}`, WIDTH/2, HEIGHT/2-30);
            ctx.strokeStyle=CYAN; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(WIDTH/2-100, HEIGHT/2+150, 200, 45, 10); ctx.stroke(); ctx.fillStyle=CYAN; ctx.fillText(t('restart'), WIDTH/2, HEIGHT/2+180);
            ctx.strokeStyle=MAGENTA; ctx.beginPath(); ctx.roundRect(WIDTH/2-100, HEIGHT/2+205, 200, 45, 10); ctx.stroke(); ctx.fillStyle=MAGENTA; ctx.fillText(t('menu'), WIDTH/2, HEIGHT/2+235);
        }

        function drawInfo() { ctx.textAlign='center'; ctx.font='bold 48px Impact'; ctx.fillStyle=CYAN; ctx.fillText(t('info'), WIDTH/2, 80); ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(t('in_dev'), WIDTH/2, HEIGHT/2); drawBackButton(); }
        function drawRecords() { ctx.textAlign='center'; ctx.font='bold 48px Impact'; ctx.fillStyle=YELLOW; ctx.fillText(t('records'), WIDTH/2, 80); ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(t('no_records'), WIDTH/2, HEIGHT/2); drawBackButton(); }
        function drawSettings() {
            ctx.textAlign='center'; ctx.font='bold 48px Impact'; ctx.fillStyle=PURPLE; ctx.fillText(t('settings'), WIDTH/2, 80);
            ctx.font='24px Segoe UI'; ctx.fillStyle=WHITE; ctx.fillText(t('language'), WIDTH/2, 200);
            ctx.strokeStyle = (currentLang==='ru')?GREEN:'#666'; ctx.lineWidth = (currentLang==='ru')?4:2; ctx.beginPath(); ctx.roundRect(WIDTH/2-210,280,200,60,15); ctx.stroke(); ctx.fillStyle = (currentLang==='ru')?GREEN:'#666'; ctx.fillText(t('russian'), WIDTH/2-110, 320);
            ctx.strokeStyle = (currentLang==='en')?GREEN:'#666'; ctx.lineWidth = (currentLang==='en')?4:2; ctx.beginPath(); ctx.roundRect(WIDTH/2+10,280,200,60,15); ctx.stroke(); ctx.fillStyle = (currentLang==='en')?GREEN:'#666'; ctx.fillText(t('english'), WIDTH/2+110, 320);
            drawBackButton();
        }
        function drawBackButton() { ctx.strokeStyle='#aaa'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(WIDTH/2-150, HEIGHT-70, 300, 55, 15); ctx.stroke(); ctx.fillStyle=WHITE; ctx.font='32px Segoe UI'; ctx.textAlign='center'; ctx.fillText(t('back'), WIDTH/2, HEIGHT-32); }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
